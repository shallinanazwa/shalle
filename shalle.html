<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shalle' – Mini Market & Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3A1430; --berry:#8E2C5C; --pistachio:#C5DC9A; --pistachio-d:#5E7F2B;
  --blush:#F8E6EA; --paper:#FFFBF9; --ink:#2B1626; --muted:#7B6573; --line:#EBD9DE; --bad:#B3261E;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#1E151C;font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}

#device{position:relative;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}
#phone{position:relative;z-index:1;width:min(100vw,430px);height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
#device .sb-btn,#island,#homebar{display:none}

@media (min-width:520px){
  #device{width:300px;height:610px;flex:none}
  #phone{
    width:300px;height:610px;
    border:9px solid #1c1c1e;
    border-radius:48px;
    box-shadow:0 0 0 2px #48484a, 0 0 0 4px #2c2c2e, 0 25px 60px rgba(0,0,0,0.6), inset 0 0 0 1px #000;
    position:relative;
    overflow:hidden;
  }
  #device .sb-btn{display:block;position:absolute;width:4px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#5c5b60,#2c2c2e);z-index:0}
  #device .sb-btn.l{left:-11px}
  #device .sb-btn.r{right:-11px;border-radius:0 2px 2px 0;background:linear-gradient(90deg,#2c2c2e,#5c5b60)}
  
  /* Dynamic Island / Notch iPhone 18 Pro */
  #island{
    display:flex;align-items:center;justify-content:space-between;padding:0 8px;
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:90px;height:24px;border-radius:20px;background:#000;z-index:100;pointer-events:none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #island .lens{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1a2b4c,#050814 70%);border:1px solid #111}
  #island .sensor{width:6px;height:6px;border-radius:50%;background:#0a0d18}
  
  #homebar{display:block;position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:4px;background:#2B1626;z-index:100;pointer-events:none}
  #phone[data-view="lock"] #homebar, #phone[data-view="ios_home"] #homebar{background:#fff}
  
  #sb{padding:12px 18px 4px;font-size:11px;min-height:36px;z-index:90}
  #sb>span:last-child{display:flex;gap:6px}
  #nav{padding-bottom:14px}
  #nav button{font-size:10px}
  #nav button svg{width:18px;height:18px}
  #toast{bottom:70px;font-size:11.5px}
  .scroll{padding:0 12px 18px}
}

#sb{flex:none;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 22px 6px;font-size:12px;font-weight:700;background:transparent;z-index:20}
#phone[data-view="lock"] #sb, #phone[data-view="ios_home"] #sb{color:#fff}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* Background Lucu Nuansa Cafe & Pastry */
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 24px;-webkit-overflow-scrolling:touch;
  background-color: #FFFBF9;
  background-image: radial-gradient(#F3D5E0 1.2px, transparent 1.2px), radial-gradient(#E2ECC8 1.2px, #FFFBF9 1.2px);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
}

/* LOCK SCREEN iOS STYLE */
.lock{
  flex:1;
  background: linear-gradient(180deg, rgba(40,15,35,0.4) 0%, rgba(20,5,18,0.8) 100%), 
              url('https://images.unsplash.com/photo-1517433670267-08bbd4be890f?q=80&w=600&auto=format&fit=crop') center/cover no-repeat;
  color:#fff;display:flex;flex-direction:column;align-items:center;padding:10px 20px 20px;overflow-y:auto;position:relative;
}
.lock .ios-widget{text-align:center;margin-top:15px}
.lock .ios-date{font-size:13px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;opacity:0.9;color:#F8E6EA}
.lock .big{font-family:var(--sans);font-size:52px;font-weight:700;letter-spacing:-1px;line-height:1;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,0.3)}
.lock .logo{width:46px;height:46px;margin-top:15px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.3))}
.lock h1{font-family:var(--serif);font-weight:700;font-size:22px;margin:4px 0 0;text-shadow:0 2px 4px rgba(0,0,0,0.4)}
.lock p{margin:2px 0 0;opacity:.85;font-size:11.5px}
.dots{display:flex;gap:12px;margin:14px 0 4px;height:12px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);background:rgba(0,0,0,0.2)}
.dots i.on{background:#fff;border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,0.8)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#pinMsg{min-height:16px;font-size:11.5px;color:#FFB4C6;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(3,58px);gap:10px 16px;margin-top:8px}
.keys button{height:58px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);color:#fff;font-size:22px;font-weight:500;transition:background .15s}
.keys button:active{background:rgba(255,255,255,.4)}
.keys button.ghost{background:none;font-size:12px}
.keys .sp{visibility:hidden}
.lock-bottom-icons{width:100%;display:flex;justify-content:space-between;padding:0 10px;margin-top:auto}
.icon-circle{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:14px}

/* HEADER & COMPONENTS */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:36px;height:36px;flex:none}
.brand h2{font-family:var(--serif);font-size:20px;margin:0;line-height:1.1}
.brand small{color:var(--muted);font-size:11px}
.cartbtn{position:relative;width:40px;height:40px;border-radius:12px;background:var(--blush);display:grid;place-items:center}
.cartbtn svg{width:20px;height:20px}
.cartbtn i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--berry);color:#fff;font:700 10px/18px var(--sans);text-align:center;font-style:normal}
.cartbtn i:empty{display:none}
.search input{width:100%;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-size:13px}
.search input:focus{border-color:var(--berry);outline:none}
.chips{display:flex;gap:6px;margin:10px 0}
.chip{padding:6px 14px;border-radius:99px;background:var(--blush);font-weight:500;font-size:12px}
.chip.on{background:var(--plum);color:#fff}
.alert{background:#FFF1D6;border:1px solid #F0D79A;color:#6B4B00;padding:8px 10px;border-radius:10px;font-size:11px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(0,0,0,0.02)}
.card.out{opacity:.6}
.tile{position:relative;aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.tile .em{font-size:42px;line-height:1}
.tile img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:6px;left:6px;background:var(--plum);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:99px}
.tag.warn{background:#E8A400;color:#2B1626}
.card h3{font-size:12px;line-height:1.25;margin:6px 0 2px;font-weight:700;min-height:30px}
.meta{font-size:10.5px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.card .row b{font-size:12.5px;color:var(--berry)}
.add{width:28px;height:28px;border-radius:9px;background:var(--plum);color:#fff;font-size:16px;line-height:1}
.add:disabled{background:#CDBFC6}
.stk{font-size:10px;color:var(--muted);margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px;font-size:12px}

/* NAVIGATION & CARTS */
#bar{display:none;margin:0 10px 6px;background:var(--plum);color:#fff;border-radius:14px;padding:8px 10px 8px 12px;align-items:center;justify-content:space-between}
#bar b{font-family:var(--serif);font-size:14px}
#bar small{display:block;opacity:.8;font-size:10.5px}
.btn{height:42px;padding:0 16px;border-radius:12px;background:var(--berry);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px}
.btn.full{width:100%}
.btn.alt{background:var(--blush);color:var(--plum)}
.btn.pist{background:var(--pistachio);color:var(--plum)}
.btn.sm{height:34px;padding:0 12px;font-size:11.5px;border-radius:10px}
.btn.danger{background:#FBE3E1;color:var(--bad)}
#nav{flex:none;display:none;border-top:1px solid var(--line);background:#fff;padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 4px)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:4px 0;font-weight:500}
#nav button svg{width:18px;height:18px}
#nav button.on{color:var(--berry);font-weight:700}

/* FLOW PAGES & RECEIPT */
.fh{display:flex;align-items:center;gap:8px;padding:2px 0 6px}
.back{width:34px;height:34px;border-radius:10px;background:var(--blush);display:grid;place-items:center;font-size:16px}
.fh h2{font-family:var(--serif);font-size:18px;margin:0}
.steps{display:flex;gap:4px;margin:2px 0 10px}
.steps i{flex:1;height:4px;border-radius:8px;background:var(--line)}
.steps i.on{background:var(--berry)}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.sec h4{margin:0 0 6px;font-size:12.5px}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci .tile{width:48px;flex:none;border-radius:10px}
.ci .tile .em{font-size:24px}
.ci .info{flex:1;min-width:0}
.ci .info b{display:block;font-size:12px}
.ci .info span{font-size:10.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:24px;height:24px;border-radius:7px;background:var(--blush);font-weight:700;font-size:12px}
.qty span{min-width:16px;text-align:center;font-weight:700;color:var(--ink);font-size:11.5px}
.del{color:var(--bad);font-size:11px;font-weight:700;padding:4px}
.sum{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.sum.t{font-family:var(--serif);font-size:16px;font-weight:700;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;color:var(--plum)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;width:100%;text-align:left;margin-bottom:8px}
.opt.on{border-color:var(--berry);background:#FFF5F8}
.opt .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.opt.on .r{border-color:var(--berry);background:radial-gradient(circle,var(--berry) 45%,transparent 50%)}
.opt b{display:block;font-size:12px}
.opt span{font-size:11px;color:var(--muted)}
label.f{display:block;font-size:11px;font-weight:700;margin:8px 0 2px}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:12.5px}
.in:focus{outline:none;border-color:var(--berry)}
textarea.in{min-height:60px;resize:vertical}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:11.5px}
.pill.on{border-color:var(--berry);background:var(--berry);color:#fff}
.note{font-size:10.5px;color:var(--muted);margin-top:6px}
.qr{width:150px;height:150px;margin:6px auto;display:block;background:#fff;padding:6px;border:1px solid var(--line);border-radius:12px}
.va{font-family:var(--serif);font-size:16px;letter-spacing:1px;text-align:center;background:var(--blush);border-radius:10px;padding:8px;margin-top:8px}
.big-change{font-family:var(--serif);font-size:15px;color:var(--pistachio-d);font-weight:700}
.sticky{position:sticky;bottom:0;padding:8px 0 0;background:linear-gradient(transparent,var(--paper) 30%)}

/* RECEIPT */
.receipt{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 12px;font-size:11px;max-width:100%;margin:0 auto 10px;position:relative}
.receipt .c{text-align:center}
.receipt .logo{width:42px;height:42px}
.receipt h3{font-family:var(--serif);font-size:18px;margin:2px 0 0}
.receipt hr{border:0;border-top:1px dashed #9a8a93;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.receipt .it{padding:2px 0}
.receipt small{color:var(--muted)}
.receipt .tot{font-weight:700;font-size:13.5px}
.stamp{display:inline-block;border:1.5px solid var(--pistachio-d);color:var(--pistachio-d);font-weight:700;padding:1px 8px;border-radius:4px;letter-spacing:1px;font-size:10px}

/* HISTORY & ADMIN */
.h-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:block;width:100%;text-align:left}
.h-item .r{display:flex;justify-content:space-between;font-size:12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat div{background:var(--plum);color:#fff;border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--serif);font-size:16px}
.stat span{font-size:10.5px;opacity:.8}
.arow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.arow .hd{display:flex;gap:8px;align-items:center;font-size:12px}
.arow .tile{width:38px;flex:none;border-radius:8px}
.arow .tile .em{font-size:20px}
.arow .g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.arow .g label{font-size:10px;color:var(--muted);font-weight:700}
.arow .g .in{padding:6px 8px;font-size:12px}
.arow .acts{display:flex;gap:6px;margin-top:6px}
.low{color:var(--bad);font-weight:700;font-size:10px}

#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:11.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MUSIK SHEET */
#musicSheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(58,20,48,.35);z-index:150;display:none;flex-direction:column;padding:12px 14px 20px}
#musicSheet.open{display:flex}
.mp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mp-h b{font-family:var(--serif);font-size:16px}
.mp-x{width:28px;height:28px;border-radius:8px;background:var(--blush)}
.mp-now{display:flex;gap:10px;align-items:center;background:var(--plum);color:#fff;border-radius:12px;padding:10px}
.mp-now b{display:block;font-size:12.5px}
.mp-now span{font-size:10.5px;opacity:.8}
.eq{display:flex;gap:2.5px;align-items:flex-end;height:20px;width:24px;flex:none}
.eq i{flex:1;background:var(--pistachio);border-radius:2px;height:20%}
.eq.on i{animation:eq 1s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:.2s}.eq.on i:nth-child(3){animation-delay:.4s}.eq.on i:nth-child(4){animation-delay:.6s}
@keyframes eq{50%{height:100%}}
.mp-ctl{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0 4px}
.mp-ctl button{width:38px;height:38px;border-radius:50%;background:var(--blush);color:var(--plum);font-weight:700;font-size:14px}
.mp-ctl button.big{width:46px;height:46px;background:var(--berry);color:#fff;font-size:16px}
.mp-vol{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:4px 0 6px}
.mp-vol input{flex:1;accent-color:var(--berry)}
.mp-list{flex:1;min-height:50px;overflow-y:auto;margin-bottom:6px}
.mp-it{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:6px 4px;border-radius:10px}
.mp-it.on{background:var(--blush)}
.mp-it .t{flex:1;min-width:0}
.mp-it b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-it small{color:var(--muted);font-size:10px}
.mp-it .rm{color:var(--bad);font-size:10px;font-weight:700;padding:4px}
.mp-chk{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:6px}
#nav button.pl{color:var(--berry)}

/* DASHBOARD ANIMATED HERO */
.brand svg{flex:none}
.brand>div{min-width:0}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:12px 12px;background:linear-gradient(135deg,#FBE9EE 0%,#FFF6EC 55%,#E9F2D6 100%);border:1px solid var(--line);margin-bottom:10px;min-height:135px}
.hero .blob{position:absolute;border-radius:50%;filter:blur(14px);opacity:.55;animation:drift 9s ease-in-out infinite alternate}
.hero .b1{width:100px;height:100px;background:#F5C6D4;top:-30px;right:-20px}
.hero .b2{width:80px;height:80px;background:#CFE3A8;bottom:-30px;left:20px;animation-delay:-3s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(14px,10px) scale(1.12)}}

.hero .fl{position:absolute;font-size:15px;opacity:.9;animation:floaty 5s ease-in-out infinite;user-select:none;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-10px) rotate(9deg)}}

.hero .tw{position:absolute;color:#C99AAE;font-size:10px;animation:twinkle 2.6s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

.hero-txt{position:relative;z-index:2;max-width:62%}
.hero small{color:var(--berry);font-weight:700;font-size:10.5px;letter-spacing:.3px}
.hero h1{font-family:var(--serif);font-size:19px;line-height:1.12;margin:2px 0 4px;color:var(--plum)}
.hero p{font-size:10.5px;color:var(--muted);margin:0 0 8px;line-height:1.3}
.cup{position:absolute;right:4px;bottom:4px;width:80px;z-index:1;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.cup .cherry{transform-box:fill-box;transform-origin:50% 100%;animation:wig 2.8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}

.cup .shadow{transform-box:fill-box;transform-origin:center;animation:shad 3.4s ease-in-out infinite}
@keyframes shad{0%,100%{transform:scale(1);opacity:.14}50%{transform:scale(.8);opacity:.6}}

.promos{display:flex;gap:6px;margin-bottom:10px}
.promo{flex:1;position:relative;overflow:hidden;border-radius:14px;padding:8px 9px;background:#fff;border:1px solid var(--line)}
.promo::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}

.promo b{display:block;font-family:var(--serif);font-size:13px;color:var(--berry)}
.promo span{font-size:10px;color:var(--muted);line-height:1.2;display:block;margin-top:2px}

const prod = id => S.products.find(p=>p.id===id);
const cartItems = () => Object.entries(S.cart).map(([id,q])=>({p:prod(+id),q})).filter(x=>x.p);
const cartCount = () => cartItems().reduce((a,x)=>a+x.q,0);
const freeQty = q => Math.floor(q/(PROMO.buy+PROMO.free))*PROMO.free;
function calc(){
  let gross=0, promo=0;
  cartItems().forEach(({p,q})=>{ gross+=p.price*q; promo+=freeQty(q)*p.price; });
  const after=gross-promo, disc=Math.round(after*DISC_PCT/100);
  return {gross,promo,disc,net:after-disc};
}
const subtotal = () => calc().net;
const fee = () => S.order.mode==='delivery' ? courier().fee : 0;

function tick(){

}
function updateSys(){
  const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  const on=navigator.onLine;
  const type=c&&c.effectiveType?c.effectiveType.toUpperCase():'';
  setT('sbNet', on?(type||'5G'):'Offline');
  const b=bat?Math.round(bat.level*100)+'%': '100%';
  setT('sbBat', b);
}
setInterval(tick,1000);
window.addEventListener('online',updateSys); window.addEventListener('offline',updateSys);
try{
  if(navigator.getBattery){ navigator.getBattery().then(b=>{bat=b;['levelchange','chargingchange'].forEach(e=>b.addEventListener(e,updateSys));updateSys()}).catch(()=>{}); }

/* ====== PIN ====== */
function key(d){
  if(S.view!=='lock') return;
  if(d==='del') S.pin=S.pin.slice(0,-1);
  else if(S.pin.length<6) S.pin+=d;
  paintDots();
  if(S.pin.length===6){
    if(S.pin===PIN){ 
      S.unlocked=true; S.pin=''; musicAuto(); 
      go('ios_home'); 
    }
    else{
      setT('pinMsg','PIN salah, coba lagi');
      const el=$('#dots'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      setTimeout(()=>{S.pin='';paintDots()},400);
    }
  } else setT('pinMsg','');
}
function paintDots(){ document.querySelectorAll('#dots i').forEach((e,i)=>e.classList.toggle('on',i<S.pin.length)); }
document.addEventListener('keydown',e=>{
  if(S.view==='lock'){ if(/^\d$/.test(e.key)) key(e.key); else if(e.key==='Backspace') key('del'); }
});

/* ====== NAVIGASI ====== */
function go(v){ S.view=v; render(); }
function render(){
  const v=S.view, sc=$('#screen');
  const views={
    lock:vLock,
    ios_home:vIosHome,
    app:vApp,
    shop:vShop,
    cart:vCart,
    delivery:vDelivery,
    review:vReview,
    pay:vPay,
    receipt:vReceipt,
    history:vHistory,
    admin:vAdminApp
  };
  sc.innerHTML=views[v]();
  $('#phone').dataset.view=v;
  $('#nav').style.display=['shop','history'].includes(v)?'flex':'none';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='shop') renderList(true);
  if(v==='ios_home') homeInit();
  if(v==='app'&&APPDEF[S.app]&&APPDEF[S.app].init) APPDEF[S.app].init();
  if(CAM.stream&&!(v==='app'&&S.app==='cam')) camStop();
  applySet();
  updateBar(); tick(); updateSys();
  if(S.prev!==v){ const s=sc.querySelector('.scroll'); if(s) s.scrollTop=0; }
  S.prev=v;
}
function updateBar(){
  const bar=$('#bar'), n=cartCount();
  if(S.view==='shop' && n>0){
    bar.style.display='flex';
    bar.innerHTML=`<div><b>${rp(subtotal())}</b><small>${n} barang di keranjang</small></div><button class="btn pist sm" onclick="go('cart')">Lihat keranjang</button>`;
  } else bar.style.display='none';
  const bd=document.getElementById('cartBadge'); if(bd) bd.textContent=n||'';
}

/* ====== VIEW: HOME SCREEN (Soft Pink Coquette x Dark Denim) ====== */
function genDenim(){
  const N=256,c=document.createElement('canvas'); c.width=c.height=N; const x=c.getContext('2d');
  x.fillStyle='#13264A'; x.fillRect(0,0,N,N);
  for(let i=-N;i<N*2;i+=2){
    const a=.04+Math.random()*.13, l=140+Math.random()*60|0;
    x.strokeStyle='rgba('+(l-40)+','+l+','+(l+55)+','+a+')'; x.lineWidth=.8+Math.random()*1.1;
    x.beginPath(); x.moveTo(i,0); x.lineTo(i+N,N); x.stroke();
  }
  for(let k=0;k<2600;k++){
    const px=Math.random()*N, py=Math.random()*N, len=2+Math.random()*5, ang=Math.PI/4+(Math.random()-.5)*.5;
    x.strokeStyle=Math.random()<.5?'rgba(150,180,225,.12)':'rgba(2,10,30,.2)'; x.lineWidth=.8;
    x.beginPath(); x.moveTo(px,py); x.lineTo(px+Math.cos(ang)*len,py+Math.sin(ang)*len); x.stroke();
  }
  const id=x.getImageData(0,0,N,N), d=id.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*26; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  x.putImageData(id,0,0);
  return c.toDataURL('image/png');
}
try{ document.documentElement.style.setProperty('--denim','url('+genDenim()+')'); }catch(e){}

function homeInit(){
  const p=document.getElementById('pages'); if(!p) return;
  p.scrollLeft=(S.hp||0)*p.clientWidth; paintHp();
  let sx=0, sl=0, drag=false, moved=false;
  p.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') return; drag=true; moved=false; sx=e.clientX; sl=p.scrollLeft; });
  p.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-sx; if(Math.abs(dx)>5){ moved=true; p.classList.add('drag'); } if(moved) p.scrollLeft=sl-dx; });
  const end=()=>{ if(!drag) return; drag=false; p.classList.remove('drag'); if(moved) homePage(Math.round(p.scrollLeft/p.clientWidth)); };
  p.addEventListener('pointerup',end); p.addEventListener('pointerleave',end);
  p.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
}
function homePage(i){ const p=document.getElementById('pages'); if(!p) return; S.hp=Math.max(0,Math.min(1,i)); p.scrollTo({left:S.hp*p.clientWidth,behavior:'smooth'}); paintHp(); }
function homeScroll(){ const p=document.getElementById('pages'); if(!p) return; S.hp=Math.round(p.scrollLeft/p.clientWidth); paintHp(); }
function paintHp(){ document.querySelectorAll('#pdots i').forEach((e,i)=>e.classList.toggle('on',i===(S.hp||0))); }

}

const SW={run:false,t0:0,acc:0,iv:null};
function swFmt(){ const t=SW.acc+(SW.run?Date.now()-SW.t0:0), cs=Math.floor(t/10)%100, s=Math.floor(t/1000)%60, m=Math.floor(t/60000); return pad(m,2)+':'+pad(s,2)+'.'+pad(cs,2); }

function swReset(){ SW.run=false; SW.acc=0; clearInterval(SW.iv); setT('swb','Mulai'); swUpdate(); }
function clockBody(){
  let t=''; for(let i=0;i<12;i++){ const a=i*30*Math.PI/180; t+='<line x1="'+(100+Math.sin(a)*80)+'" y1="'+(100-Math.cos(a)*80)+'" x2="'+(100+Math.sin(a)*88)+'" y2="'+(100-Math.cos(a)*88)+'" stroke="#031530" stroke-width="'+(i%3?2:4)+'"/>'; }
  return '<div class="sec" style="text-align:center"><svg viewBox="0 0 200 200" class="aclock"><circle cx="100" cy="100" r="94" fill="#FFF8F5" stroke="#031530" stroke-width="6"/>'+t+
    '<line id="akH" x1="100" y1="100" x2="100" y2="58" stroke="#031530" stroke-width="6" stroke-linecap="round"/><line id="akM" x1="100" y1="100" x2="100" y2="34" stroke="#031530" stroke-width="4" stroke-linecap="round"/><line id="akS" x1="100" y1="112" x2="100" y2="26" stroke="#E5708F" stroke-width="2"/><circle cx="100" cy="100" r="5" fill="#E5708F"/></svg>'+
    '<div id="akT" class="bigt">--:--:--</div><div id="akD" class="note"></div></div>'+
    '<div class="sec"><h4>Stopwatch</h4><div id="swv" class="bigt">'+swFmt()+'</div><div class="two" style="margin-top:8px"><button class="btn alt" onclick="swReset()">Reset</button><button class="btn" id="swb" onclick="swToggle()">'+(SW.run?'Jeda':(SW.acc?'Lanjut':'Mulai'))+'</button></div></div>';
}
/* foto & kamera */
const PH=[{id:'b1',src:IMG.doll,b:1},{id:'b2',src:IMG.fishpic,b:1}];
async function addPhotoBlob(b){
  const id='p'+Date.now()+Math.random().toString(36).slice(2,6);
  PH.push({id:id,src:URL.createObjectURL(b)});
  try{ await dbPut({id:id,blob:b}); }catch(e){}
  if(S.view==='app'&&S.app==='foto') render();
}
function addPhotos(files){ [...files].forEach(addPhotoBlob); toast(files.length+' foto ditambahkan'); }
async function delPhoto(i){ const p=PH[i]; if(!p||p.b) return; PH.splice(i,1); S.pv=null; try{ await dbDel(p.id); }catch(e){} render(); }
function photoBody(){
  if(S.pv!=null&&PH[S.pv]){
    const p=PH[S.pv];
    return '<div class="pbig"><img src="'+p.src+'" alt="Foto"></div><div class="two" style="margin-top:10px"><button class="btn alt" onclick="S.pv=null;render()">Tutup</button>'+(p.b?'<button class="btn alt" disabled style="opacity:.5">Bawaan</button>':'<button class="btn danger" onclick="delPhoto('+S.pv+')">Hapus</button>')+'</div>';
  }
  return '<div class="pgrid">'+PH.map((p,i)=>'<button onclick="S.pv='+i+';render()" aria-label="Foto '+(i+1)+'"><img src="'+p.src+'" alt=""></button>').join('')+'</div>'+
    '<label class="btn full" style="margin-top:10px;cursor:pointer">+ Tambah foto<input type="file" accept="image/*" multiple hidden onchange="addPhotos(this.files)"></label>';
}
const CAM={stream:null};
function camStart(){
  const v=document.getElementById('camv'), m=document.getElementById('camMsg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ if(m) m.textContent='Browser ini tidak mendukung kamera.'; return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(s=>{
    if(!(S.view==='app'&&S.app==='cam')){ s.getTracks().forEach(t=>t.stop()); return; }
    CAM.stream=s; const vv=document.getElementById('camv'); if(vv) vv.srcObject=s; setT('camMsg','');
  }).catch(()=>{ setT('camMsg','Kamera tidak bisa dibuka (izin ditolak atau diblokir browser).'); });
}
function camStop(){ if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; } }
function camShot(){
  const v=document.getElementById('camv'); if(!CAM.stream||!v||!v.videoWidth){ toast('Kamera belum siap'); return; }
  const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  const x=c.getContext('2d'); x.translate(c.width,0); x.scale(-1,1); x.drawImage(v,0,0);
  c.toBlob(b=>{ if(b){ addPhotoBlob(b); toast('Foto tersimpan di Foto'); } },'image/jpeg',.85);
}

function addCart(id){

  S.cart[id]=n; renderList(); updateBar(); toast(p.name+' ditambahkan');
}

function sumRows(withFee){
  const c=calc(), f=withFee?fee():0, o=S.order;
  return `<div class="sum"><span>Harga barang</span><span>${rp(c.gross)}</span></div>
    ${c.promo?`<div class="sum disc"><span>Promo Beli ${PROMO.buy} Gratis ${PROMO.free}</span><span>−${rp(c.promo)}</span></div>`:''}
    <div class="sum disc"><span>Diskon ${DISC_PCT}%</span><span>−${rp(c.disc)}</span></div>
    ${withFee?`<div class="sum"><span>Biaya pengantaran${o.mode==='delivery'?' ('+courier().name+')':''}</span><span>${rp(f)}</span></div>`:''}
    <div class="sum t"><span>${withFee?'Total pembayaran':'Subtotal'}</span><span>${rp(c.net+f)}</span></div>`;
}
function chg(id,d){
  const p=prod(id), n=(S.cart[id]||0)+d;
  if(n<=0){ delete S.cart[id]; }
  else if(n>p.stock){ toast('Stok '+p.name+' hanya '+p.stock); return; }
  else S.cart[id]=n;
  render();
}
function rmCart(id){ delete S.cart[id]; render(); toast('Barang dihapus'); }

function quick(T){
  const set=new Set([T]);
  [50000,100000,200000,500000].forEach(v=>{ if(v>=T) set.add(v); });
  return [...set].sort((a,b)=>a-b).slice(0,4);
}
function paintChange(){
  const rec=parseInt(S.pay.received||0), T=total(); setT('chg', rec>=T?rp(rec-T):'—');
}
function qrSvg(seed){
  let s=(seed>>>0)||1; const r=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296};
  const n=25; let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16)) continue;
    if(r()>.52) d+=`M${x} ${y}h1v1h-1z`;
  }
  const fp=(ox,oy)=>`M${ox} ${oy}h7v7h-7zM${ox+1} ${oy+1}h5v5h-5zM${ox+2} ${oy+2}h3v3h-3z`;
  return `<svg class="qr" viewBox="-1 -1 27 27" role="img" aria-label="Kode QRIS simulasi"><path fill="#2B1626" fill-rule="evenodd" d="${d}${fp(0,0)}${fp(18,0)}${fp(0,18)}"/></svg>`;
}

function finish(){

  if(P.method==='cash'){
    rec=parseInt(P.received||0);
    if(!(rec>=T)){ toast('Uang diterima kurang dari total'); return; }

  }
  const label=P.method==='cash'?'Tunai':P.method==='bank'?'Transfer Bank '+P.bank:P.method==='qris'?'QRIS':'E-Wallet '+P.ew;
  const d=new Date(); S.seq++;

    ts:d.getTime(), buyer:S.order.name.trim(), mode:S.order.mode, courier:S.order.mode==='delivery'?courier().name:'', phone:S.order.phone, addr:S.order.addr.trim(),

  S.history.unshift(trx); save();
  S.cart={}; S.last=trx; S.order.mode='pickup'; S.order.addr='';

}

const GEN=[
 {id:'g1',gen:1,name:'Calm Morning',artist:'Shalle Original · tenang & lembut',bpm:60,wave:'sine',arp:0,mel:.35,
  chords:[[48,55,59,64],[45,52,55,60],[41,48,52,57],[43,50,55,64]],scale:[72,74,76,79,81,84]},

 {id:'g3',gen:1,name:'Dreamy Pop',artist:'Shalle Original · pop ringan',bpm:96,wave:'sine',arp:1,mel:.4,
  chords:[[50,57,62,66],[47,54,59,62],[43,50,55,59],[45,52,57,61]],scale:[74,76,78,81,83,86]}
];
const M={ctx:null,master:null,sess:null,timer:null,playing:false,cur:0,audio:null,list:GEN.slice(),
  vol:LS.get('shalle_vol',0.55),auto:LS.get('shalle_auto',true),started:false,open:false,imp:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mCtx(){
  if(!M.ctx){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    M.ctx=new C(); M.master=M.ctx.createGain(); M.master.gain.value=M.vol*.9;
    const lp=M.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4800;
    M.master.connect(lp); lp.connect(M.ctx.destination);
    const len=Math.floor(M.ctx.sampleRate*2.8), b=M.ctx.createBuffer(2,len,M.ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    M.imp=b;
  }
  if(M.ctx.state==='suspended') M.ctx.resume();
  return M.ctx;
}
function voice(f,t,dur,type,g,att,rel,det){
  const c=M.ctx,S2=M.sess,o=c.createOscillator(),v=c.createGain();
  o.type=type; o.frequency.value=f; if(det) o.detune.value=det;
  v.gain.setValueAtTime(0.0001,t); v.gain.linearRampToValueAtTime(g,t+att); v.gain.setTargetAtTime(0.0001,t+dur,rel/3);
  o.connect(v); v.connect(S2.out);
  const w=c.createGain(); w.gain.value=.55; v.connect(w); w.connect(S2.rev);
  o.start(t); o.stop(t+dur+rel+.3);
}
function genStep(cfg,step,t){
  const spb=60/cfg.bpm, bar=Math.floor(step/8), pos=step%8, ch=cfg.chords[bar%cfg.chords.length];
  if(pos===0){
    ch.forEach((m,i)=>{ voice(mtof(m),t+i*.04,spb*8,cfg.wave,.06,1.3,2,-5); voice(mtof(m),t+i*.04,spb*8,'sine',.04,1.5,2,6); });
    voice(mtof(ch[0]-12),t,spb*8,'sine',.09,.8,2);
  }
  if(cfg.arp && Math.random()<.85){
    const idx=[0,1,2,1,3,2,1,2][pos]; voice(mtof(ch[idx%ch.length]+12),t,spb*.8,'triangle',.045,.01,.6);
  }
  if(pos%2===0 && Math.random()<cfg.mel){
    const n=cfg.scale[Math.floor(Math.random()*cfg.scale.length)];
    voice(mtof(n),t,spb*1.4,'sine',.05,.03,1.8);
  }
}
function genStart(cfg){
  const c=mCtx(); if(!c){ toast('Browser tidak mendukung audio'); return false; }
  const out=c.createGain(); out.gain.value=1; const rev=c.createConvolver(); rev.buffer=M.imp;
  const rg=c.createGain(); rg.gain.value=.7; rev.connect(rg); rg.connect(out); out.connect(M.master);
  M.sess={out,rev}; let step=0, next=c.currentTime+.15, spb=60/cfg.bpm/2;
  const run=()=>{ while(next<c.currentTime+.8){ genStep(cfg,step,next); next+=spb; step++; } };
  run(); M.timer=setInterval(run,200); return true;
}
function stopSess(){
  clearInterval(M.timer); M.timer=null;
  if(M.sess){ const s=M.sess, c=M.ctx; s.out.gain.cancelScheduledValues(c.currentTime); s.out.gain.setTargetAtTime(0,c.currentTime,.12); setTimeout(()=>{try{s.out.disconnect()}catch(e){}},900); M.sess=null; }
}
function stopAll(){
  stopSess();
  if(M.audio){ M.audio.pause(); M.audio.onended=null; M.audio=null; }
  M.playing=false;
}
function mPlay(i){
  const it=M.list[i]; if(!it) return;
  stopAll(); M.cur=i; M.started=true;
  if(it.gen){ M.playing=genStart(it); }
  else{
    const a=new Audio(it.url); a.volume=M.vol; M.audio=a;
    a.onended=()=>mNext(1);
    a.play().then(()=>{M.playing=true;mRender()}).catch(()=>{toast('Lagu tidak bisa diputar di sini');M.playing=false;mRender()});
    M.playing=true;
  }
  mRender();
}
function mNext(d){ mPlay((M.cur+d+M.list.length)%M.list.length); }
function mToggle(){
  if(M.playing){
    const it=M.list[M.cur];
    if(it.gen) stopSess(); else if(M.audio) M.audio.pause();
    M.playing=false; mRender();
  } else {
    const it=M.list[M.cur];
    if(!it.gen && M.audio){ M.audio.play(); M.playing=true; mRender(); } else mPlay(M.cur);
  }
}
function mVol(v){
  M.vol=v/100; if(M.master) M.master.gain.value=M.vol*.9; if(M.audio) M.audio.volume=M.vol; LS.set('shalle_vol',M.vol);
}
function mAuto(on){ M.auto=on; LS.set('shalle_auto',on); }
function musicAuto(){ if(M.auto && !M.started) mPlay(0); }
function openMusic(){ M.open=true; mRender(); }
function closeMusic(){ M.open=false; mRender(); }

/* simpan lagu pengguna di IndexedDB */
function mdb(){ return new Promise((res,rej)=>{ try{
  const r=indexedDB.open('shalle_music',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id'});
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
}catch(e){rej(e)} }); }
async function dbAll(){ const d=await mdb(); return new Promise((res,rej)=>{const q=d.transaction('t').objectStore('t').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}); }
async function dbPut(rec){ const d=await mdb(); return new Promise((res,rej)=>{const q=d.transaction('t','readwrite').objectStore('t').put(rec);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)}); }
async function dbDel(id){ const d=await mdb(); return new Promise((res,rej)=>{const q=d.transaction('t','readwrite').objectStore('t').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)}); }
function addTracks(files){
  [...files].forEach(async(f,i)=>{
    const base=f.name.replace(/\.[^.]+$/,''), parts=base.split(/\s+[-–]\s+/);
    const rec={id:'u'+Date.now()+'_'+i,artist:parts.length>1?parts[0]:'Lagu saya',name:parts.length>1?parts.slice(1).join(' - '):base,blob:f};
    M.list.push({id:rec.id,name:rec.name,artist:rec.artist,url:URL.createObjectURL(f),user:1});
    try{ await dbPut(rec); }catch(e){}
    mRender();
  });
  toast(files.length+' lagu ditambahkan');
}
async function rmTrack(id){
  const i=M.list.findIndex(t=>t.id===id); if(i<0) return;
  const wasCur=i===M.cur; if(wasCur) stopAll();
  M.list.splice(i,1); if(M.cur>=i && M.cur>0) M.cur--; if(wasCur) M.cur=0;
  try{ await dbDel(id); }catch(e){}
  mRender();
}
function mRender(){
  const sh=document.getElementById('musicSheet'); if(!sh) return;
  const nb=document.getElementById('navMusic'); if(nb) nb.classList.toggle('pl',M.playing);
  sh.classList.toggle('open',M.open);
  if(!M.open) return;
  const it=M.list[M.cur]||M.list[0];
  sh.innerHTML=`<div class="mp-h"><b>Musik</b><button class="mp-x" onclick="closeMusic()" aria-label="Tutup">✕</button></div>
  <div class="mp-now"><div class="eq ${M.playing?'on':''}"><i></i><i></i><i></i><i></i></div><div style="min-width:0"><b>${esc(it.name)}</b><span>${esc(it.artist)}</span></div></div>
  <div class="mp-ctl"><button onclick="mNext(-1)" aria-label="Sebelumnya">⏮</button><button class="big" onclick="mToggle()" aria-label="${M.playing?'Jeda':'Putar'}">${M.playing?'❚❚':'▶'}</button><button onclick="mNext(1)" aria-label="Berikutnya">⏭</button></div>
  <div class="mp-vol"><span>Volume</span><input type="range" min="0" max="100" value="${Math.round(M.vol*100)}" oninput="mVol(this.value)" aria-label="Volume"></div>
  <div class="mp-list">${M.list.map((t,i)=>`<div class="mp-it ${i===M.cur?'on':''}"><button class="t" style="text-align:left" onclick="mPlay(${i})"><b>${esc(t.name)}</b><small>${esc(t.artist)}</small></button>${t.user?`<button class="rm" onclick="rmTrack('${t.id}')">Hapus</button>`:''}</div>`).join('')}</div>
  <label class="btn alt sm" style="cursor:pointer">+ Tambah lagu dari perangkat<input type="file" accept="audio/*" multiple hidden onchange="addTracks(this.files)"></label>
  <div class="note">Untuk lagu K-pop seperti Magnetic (ILLIT) atau Hurt (NewJeans), tambahkan file lagu milikmu sendiri. Beri nama file "Artis - Judul.mp3" supaya tampil rapi.</div>
  <label class="mp-chk"><input type="checkbox" ${M.auto?'checked':''} onchange="mAuto(this.checked)"> Putar musik otomatis setelah buka PIN</label>`;
}
dbAll().then(recs=>{ recs.forEach(r=>{ if(String(r.id).charAt(0)==='p') PH.push({id:r.id,src:URL.createObjectURL(r.blob)}); else M.list.push({id:r.id,name:r.name,artist:r.artist,url:URL.createObjectURL(r.blob),user:1}); }); mRender(); }).catch(()=>{});

/* ====== MULAI ====== */
render();
</script>
<script id="shalle-addon">
/* ===== TAMBAHAN FITUR BARU (membungkus fungsi asli, kode asli tidak diubah) ===== */
(()=>{
const X=Object.assign({fav:[],rev:{},mem:{},slog:[],min:5,face:''},LS.get('shalle_x',{}));
Object.assign(X,{sort:'rec',pmin:'',pmax:'',favOnly:false,at:'pesanan',per:'daily',redeem:false,rs:5});
const xs=()=>LS.set('shalle_x',{fav:X.fav,rev:X.rev,mem:X.mem});
const PT_RP=100, EARN=10000;
const LV=[['Bronze',0,1],['Silver',100,1.25],['Gold',300,1.5],['Platinum',600,2]];
const lvl=n=>[...LV].reverse().find(l=>n>=l[1]);
const mem=n=>X.mem[String(n).trim().toLowerCase()]||{name:n,pts:0,life:0};
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const avg=id=>{const r=X.rev[id]||[];return r.length?r.reduce((a,x)=>a+x.s,0)/r.length:0};
const sold=name=>S.history.reduce((a,t)=>a+t.items.filter(i=>i.name===name).reduce((b,i)=>b+i.q,0),0);
const steps=t=>['Menunggu pembayaran','Diproses',t.mode==='delivery'?'Dalam pengiriman':'Siap diambil','Selesai'];
const TRK={'J&T Express':'https://jet.co.id/track','JNE Reguler':'https://www.jne.co.id/id/tracking/trace','SiCepat':'https://www.sicepat.com/checkAwb'};

/* --- Poin: diskon dari penukaran poin masuk ke perhitungan total --- */
const calc0=calc;
window.calc=function(){const r=calc0();r.ptsUsed=0;r.ptsDisc=0;
  if(X.redeem&&S.order.name.trim()){const u=Math.min(mem(S.order.name).pts,Math.floor(r.net/PT_RP));r.ptsUsed=u;r.ptsDisc=u*PT_RP;r.net-=r.ptsDisc}
  return r};
const sr0=sumRows;
window.sumRows=function(w){let h=sr0(w);const c=calc();
  return c.ptsUsed?h.replace('<div class="sum t">',`<div class="sum disc"><span>Tukar ${c.ptsUsed} poin</span><span>−${rp(c.ptsDisc)}</span></div><div class="sum t">`):h};
const loyBox=()=>{const m=mem(S.order.name),L=lvl(m.life),nx=LV.find(l=>l[1]>m.life);
  const est=Math.floor(total()/EARN*L[2]);
  return `<div class="xlv"><b>Level ${L[0]} · ${m.pts} poin</b><small>Poin ${L[2]}x · ${nx?(nx[1]-m.life)+' poin lagi menuju '+nx[0]:'level tertinggi'} · estimasi dapat +${est} poin</small>
  <button class="btn pist sm" style="margin-top:8px" ${m.pts<1?'disabled':''} onclick="XA.redeem()">${X.redeem?'Batalkan tukar poin':'Tukar poin jadi diskon (1 poin = '+rp(PT_RP)+')'}</button></div>`};
const vr0=vReview;
window.vReview=()=>vr0().replace('<div class="sticky">',loyBox()+'<div class="sticky">');
const vh0=vHistory;
window.vHistory=()=>vh0().replace('</header>',`</header><div class="sec"><h4>Poin & level member</h4><label class="f" for="mn">Nama member</label><input class="in" id="mn" value="${esc(S.order.name)}" oninput="S.order.name=this.value;XA.mem()" placeholder="Nama saat belanja"><div id="mbox" style="margin-top:8px"></div></div>`);

/* --- Selesaikan transaksi: simpan modal, status, poin, riwayat stok --- */
const fin0=finish;
window.finish=function(){
  const its=cartItems().map(({p,q})=>({p,q})), c=calc(), n0=S.history.length;
  fin0(); if(S.history.length===n0) return;
  const t=S.history[0], m=mem(t.buyer), L=lvl(m.life);
  t.ost=t.cash?'Diproses':'Menunggu pembayaran'; t.hist=[[t.ost,t.ts]];
  t.pts=Math.floor(t.total/EARN*L[2]); t.ptsUsed=c.ptsUsed; t.ptsDisc=c.ptsDisc;
  X.mem[t.buyer.toLowerCase()]={name:t.buyer,pts:m.pts-c.ptsUsed+t.pts,life:m.life+t.pts};
  X.redeem=false; save(); xs(); render();
};
const vrc0=vReceipt;
window.vReceipt=function(){const t=S.last;let h=vrc0(); if(!t||!t.items) return h;
  const o=t.ost||'Selesai', st=steps(t), cur=Math.max(0,st.indexOf(o));
  const trk=t.mode==='delivery'?`<div class="note">Kurir: ${esc(t.courier)}${t.resi?' · Resi <b>'+esc(t.resi)+'</b>':' · resi belum diinput toko'}</div>${t.resi&&TRK[t.courier]?`<a class="btn alt sm" style="margin-top:6px" target="_blank" rel="noopener" href="${TRK[t.courier]}">Lacak di situs kurir</a>`:''}`:'';
  const box=`<div class="sec"><h4>Status pesanan</h4><div class="tl">${st.map((s,i)=>`<div class="${i<=cur?'on':''}"><i></i>${s}</div>`).join('')}</div>${trk}</div>
  ${t.pts!=null?`<div class="xlv"><b>+${t.pts} poin didapat</b><small>${t.ptsUsed?'Poin dipakai '+t.ptsUsed+' (−'+rp(t.ptsDisc)+') · ':''}Saldo ${mem(t.buyer).pts} poin · Level ${lvl(mem(t.buyer).life)[0]}</small></div>`:''}`;
  return h.replace('<div class="sticky"',box+'<div class="sticky"')};

/* --- Toko: filter harga, urutan, favorit, detail, ulasan --- */
const vs0=vShop;
window.vShop=()=>vs0().replace('<div id="list" class="grid"></div>',`<div class="xctl">
  <select class="in" onchange="X_.sort=this.value;renderList()" aria-label="Urutkan"><option value="rec">Urutkan: Rekomendasi</option><option value="cheap">Termurah</option><option value="exp">Termahal</option><option value="best">Terlaris</option></select>
  <button class="chip ${X.favOnly?'on':''}" onclick="X_.favOnly=!X_.favOnly;render()">♥ Favorit saya</button>
  <input class="in" type="number" inputmode="numeric" min="0" placeholder="Harga min" value="${X.pmin}" oninput="X_.pmin=this.value;renderList()" aria-label="Harga minimum">
  <input class="in" type="number" inputmode="numeric" min="0" placeholder="Harga maks" value="${X.pmax}" oninput="X_.pmax=this.value;renderList()" aria-label="Harga maksimum"></div><div id="list" class="grid"></div>`);
const rl0=renderList;
window.renderList=function(anim){
  const all=S.products;
  let a=all.filter(p=>(X.pmin===''||p.price>=+X.pmin)&&(X.pmax===''||p.price<=+X.pmax)&&(!X.favOnly||X.fav.includes(p.id)));
  if(X.sort==='cheap')a=[...a].sort((x,y)=>x.price-y.price);
  if(X.sort==='exp')a=[...a].sort((x,y)=>y.price-x.price);
  if(X.sort==='best')a=[...a].sort((x,y)=>sold(y.name)-sold(x.name));
  S.products=a; try{rl0(anim)}finally{S.products=all}
  const el=document.getElementById('list'); if(!el) return;
  el.querySelectorAll('.card').forEach(c=>{
    const m=(c.querySelector('.add')||{getAttribute:()=>''}).getAttribute('onclick').match(/\d+/); if(!m) return; const id=+m[0];
    const tile=c.querySelector('.tile'), f=X.fav.includes(id), r=avg(id);
    tile.style.cursor='pointer'; tile.onclick=()=>XA.detail(id); c.querySelector('h3').onclick=()=>XA.detail(id);
    const h=document.createElement('button'); h.className='heart'+(f?' on':''); h.textContent=f?'♥':'♡'; h.setAttribute('aria-label','Favorit');
    h.onclick=e=>{e.stopPropagation();XA.fav(id)}; tile.appendChild(h);
    if(r){const d=document.createElement('div');d.className='xr';d.textContent='★ '+r.toFixed(1)+' ('+X.rev[id].length+')';c.querySelector('h3').after(d)}
  });
};
const sheet=document.createElement('div'); sheet.id='xsheet'; $('#phone').appendChild(sheet);
const rn0=render;
window.render=function(){rn0(); sheet.classList.remove('open');
  if(S.view==='history'){document.querySelectorAll('.h-item').forEach((b,i)=>{const t=S.history[i]; if(!t) return; const d=document.createElement('div'); d.className='meta'; d.innerHTML='<span class="xst">'+(t.ost||'Selesai')+'</span>'+(t.resi?' · Resi '+esc(t.resi):''); b.appendChild(d)}); XA.mem()}};
const vl0=vLock;
window.vLock=vl0;

/* --- Handler --- */
window.X_=X;
window.XA={
  redeem(){if(!S.order.name.trim()){toast('Isi nama dulu');return} X.redeem=!X.redeem;render()},
  mem(){const e=document.getElementById('mbox'); if(!e) return; const n=(S.order.name||'').trim(); if(!n){e.innerHTML='<div class="note">Ketik nama untuk melihat poin dan level.</div>';return}
    const m=mem(n),L=lvl(m.life),nx=LV.find(l=>l[1]>m.life); e.innerHTML=`<div class="xlv" style="margin:0"><b>${esc(n)} · ${L[0]}</b><small>${m.pts} poin (≈ ${rp(m.pts*PT_RP)}) · ${nx?(nx[1]-m.life)+' poin menuju '+nx[0]:'level tertinggi'}</small></div><div class="note">Dapat 1 poin per ${rp(EARN)} belanja × bonus level. Bronze 1x · Silver 1,25x · Gold 1,5x · Platinum 2x.</div>`},
  fav(id){const i=X.fav.indexOf(id); i<0?X.fav.push(id):X.fav.splice(i,1); xs(); renderList(); toast(i<0?'Ditambah ke favorit':'Dihapus dari favorit')},
  detail(id){const p=prod(id); if(!p) return; const rv=X.rev[id]||[],r=avg(id),f=X.fav.includes(id),out=p.stock<=0;
    const rel=S.products.filter(q=>q.id!==id&&q.cat===p.cat).sort((a,b)=>Math.abs(a.price-p.price)-Math.abs(b.price-p.price)).slice(0,5);
    sheet.innerHTML=`<div class="fh"><button class="back" onclick="XA.close()" aria-label="Tutup">←</button><h2>Detail produk</h2></div>
    <div class="xdt" style="background:${tint(p)}">${pimg(p)}</div>
    <h3 style="font-family:var(--serif);margin:4px 0">${esc(p.name)}</h3><div class="meta">${sizeTxt(p)} · ${p.cat} · Stok ${p.stock} · Terjual ${sold(p.name)}</div>
    <div class="xr" style="margin:4px 0">${r?stars(r)+' '+r.toFixed(1)+' ('+rv.length+' ulasan)':'Belum ada ulasan'}</div>
    <div style="font-family:var(--serif);font-size:20px;color:var(--berry);font-weight:700;margin:4px 0 8px">${rp(p.price)}</div>
    <div class="two"><button class="btn sm" ${out?'disabled':''} onclick="addCart(${id})">${out?'Stok habis':'+ Keranjang'}</button><button class="btn alt sm" onclick="XA.fav(${id});XA.detail(${id})">${f?'♥ Favorit':'♡ Favoritkan'}</button></div>
    <div class="sec" style="margin-top:10px"><h4>Ulasan pelanggan</h4>${rv.map(x=>`<div class="xrv"><b>${esc(x.n)}</b> <span class="xr">${stars(x.s)}</span><br>${esc(x.c)}</div>`).join('')||'<div class="note">Jadilah yang pertama mengulas.</div>'}
      <label class="f">Nama</label><input class="in" id="rv_n" value="${esc(S.order.name)}" placeholder="Nama kamu">
      <div class="pills">${[1,2,3,4,5].map(n=>`<button class="pill ${X.rs===n?'on':''}" onclick="X_.rs=${n};XA.detail(${id})">${n}★</button>`).join('')}</div>
      <label class="f">Ulasan</label><textarea class="in" id="rv_c" placeholder="Bagaimana rasanya?"></textarea>
      <button class="btn full sm" style="margin-top:8px" onclick="XA.review(${id})">Kirim ulasan</button></div>
    ${rel.length?`<div class="sec"><h4>Produk terkait</h4><div class="xrel">${rel.map(q=>`<button onclick="XA.detail(${q.id})"><div class="tile" style="background:${tint(q)}">${pimg(q)}</div><b>${esc(q.name)}</b><br>${rp(q.price)}</button>`).join('')}</div></div>`:''}`;
    sheet.classList.add('open'); sheet.scrollTop=0},
  close(){sheet.classList.remove('open')},
  review(id){const n=document.getElementById('rv_n').value.trim(),c=document.getElementById('rv_c').value.trim(); if(!n||!c){toast('Isi nama dan ulasan');return}
    (X.rev[id]=X.rev[id]||[]).unshift({n,c,s:X.rs,ts:Date.now()}); xs(); XA.detail(id); renderList(); toast('Ulasan terkirim')}
};
})();
</script>
